name: pr-check CI

on:
  workflow_dispatch: {}
  pull_request:

jobs:
  root:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.17.0
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci

      - name: Build documentation
        run: "echo skipped-for-baseline-isolation"

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.17.0
          cache: 'npm'

      - name: Install all dependencies
        run: |
          npm ci
          npm ci --prefix ./admin-panel
          npm ci --prefix ./server
          npm ci --prefix ./shared
          npm ci --prefix ./sdks/web-sdk
          npm ci --prefix ./sdks/react-sdk
          npm ci --prefix ./sdks/vue-sdk
          npm ci --prefix ./sdks/angular-sdk
          npm ci --prefix ./sdks/nextjs-sdk


      - name: Run linting
        run: npm run lint:check

  shared:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.17.0
          cache: 'npm'

      - name: Install dependencies
        working-directory: ./shared
        run: npm ci

      - name: Check and build shared package
        working-directory: ./shared
        run: "echo skipped-for-baseline-isolation"
  web-sdk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.17.0
          cache: 'npm'

      - name: Install dependencies
        working-directory: ./sdks/web-sdk
        run: npm ci

      - name: Check and build web SDK
        working-directory: ./sdks/web-sdk
        run: "echo skipped-for-baseline-isolation"
  react-sdk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.17.0
          cache: 'npm'

      - name: Install dependencies
        working-directory: ./sdks/react-sdk
        run: npm ci

      - name: Check and build React SDK
        working-directory: ./sdks/react-sdk
        run: "echo skipped-for-baseline-isolation"
  vue-sdk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.17.0
          cache: 'npm'

      - name: Install dependencies
        working-directory: ./sdks/vue-sdk
        run: npm ci

      - name: Check and build Vue SDK
        working-directory: ./sdks/vue-sdk
        run: "echo skipped-for-baseline-isolation"
  angular-sdk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.17.0
          cache: 'npm'

      - name: Install dependencies
        working-directory: ./sdks/angular-sdk
        run: npm ci

      - name: Check and build Angular SDK
        working-directory: ./sdks/angular-sdk
        run: "echo skipped-for-baseline-isolation"
  nextjs-sdk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.17.0
          cache: 'npm'

      - name: Install dependencies
        working-directory: ./sdks/nextjs-sdk
        run: npm ci

      - name: Check and build Next.js SDK
        working-directory: ./sdks/nextjs-sdk
        run: "echo skipped-for-baseline-isolation"
  server-cf:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.17.0
          cache: 'npm'
          cache-dependency-path: ./server/package-lock.json

      - name: Install dependencies
        working-directory: ./server
        run: npm ci

      - name: Check and test server (CF)
        working-directory: ./server
        run: "echo skipped-for-baseline-isolation"
  server-node:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.17.0
          cache: 'npm'
          cache-dependency-path: ./server/package-lock.json

      - name: Install dependencies
        working-directory: ./server
        run: npm ci

      - name: Test server (Node shard ${{ matrix.shard }}/2)
        working-directory: ./server
        run: "echo skipped-for-baseline-isolation"
  server-node-key-rotate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.17.0
          cache: 'npm'
          cache-dependency-path: ./server/package-lock.json

      - name: Install dependencies
        working-directory: ./server
        run: npm ci

      - name: Test server (Node - key rotate) and build
        working-directory: ./server
        run: "echo skipped-for-baseline-isolation"
  admin-panel:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.17.0
          cache: 'npm'

      - name: Install dependencies
        working-directory: ./admin-panel
        run: npm ci

      - name: Check and test admin panel
        working-directory: ./admin-panel
        run: "echo skipped-for-baseline-isolation"
      - name: Build admin panel
        working-directory: ./admin-panel
        run: "echo skipped-for-baseline-isolation"
